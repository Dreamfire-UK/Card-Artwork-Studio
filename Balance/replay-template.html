<!doctype html><meta charset="utf-8"><title>Five Roads · Battle replay</title>
<style>body{margin:30px auto;max-width:1200px;padding:20px;background:#152127;color:#edf2eb;font:16px system-ui}h1{color:#df99b1}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0}.zone{min-height:130px;border:1px dashed #53616a;border-radius:10px;padding:12px;position:relative}.unit{background:#253a36;border:2px solid #d1879f}.enemy{background:#352d46;border-color:#aa83d1}.zone span{display:block;font-size:12px;color:#aebdb7;margin:5px 0}.zone b{font-size:15px}.arrows{color:#f1b7cb;font-size:22px!important}input{width:70%}button{padding:12px;margin-right:10px;background:#c07793;border:0;border-radius:6px;color:#fff}a{color:#df99b1}.life{font-size:22px}.active{box-shadow:0 0 0 2px #f1ddb1}p{line-height:1.5}</style>
<h1>The battle on the Five Roads</h1><p>Experimental bot replay. Each square is one zone; arrows show immediate neighbours. Rows from top: opponent rear, opponent front, your front, your rear. Opponent arrows are shown facing you.</p>
<button id="back">Previous</button><button id="next">Next</button><input id="step" type="range" min="0" value="0"><p id="event"></p><div class="life" id="life"></div><div id="board" class="board"></div><a href="Deck-breakdown.html">Card fields and matchup report</a>
<script>const frames=/*DATA*/;const step=document.getElementById('step');step.max=Math.max(0,frames.length-1);const dirs=['↑','↗','→','↘','↓','↙','←','↖'];function draw(){const f=frames[+step.value];if(!f)return;document.getElementById('event').textContent=(+step.value+1)+' / '+frames.length+' · '+f.event;document.getElementById('life').textContent='Rootbound '+f.life[0]+' life · Night Brood '+f.life[1]+' life';const board=document.getElementById('board');board.replaceChildren();for(const [owner,row] of [[1,0],[1,1],[0,1],[0,0]])for(let col=0;col<5;col++){const u=f.units.find(x=>x.owner===owner&&x.row===row&&x.col===col);const d=document.createElement('div');d.className='zone'+(u?' unit':'')+(owner?' enemy':'');const label=document.createElement('span');label.textContent=(owner?'Brood':'Court')+' '+(row?'front':'rear')+' · '+(col+1);d.append(label);if(u){const title=document.createElement('b');title.textContent=u.name;d.append(title);for(const txt of [u.stats[0]+' power / '+u.stats[1]+' defence',u.damage+' damage · '+u.scars+' scars',(u.guard?'Guard':'Attack')+' · '+(u.ready?'Ready':'Exhausted')]){const t=document.createElement('span');t.textContent=txt;d.append(t)}const arr=document.createElement('span');arr.className='arrows';arr.textContent=dirs.filter((_,i)=>u.arrows&(1<<i)).map(x=>owner?dirs[(dirs.indexOf(x)+4)%8]:x).join(' ');d.append(arr)}board.append(d)}}step.oninput=draw;document.getElementById('next').onclick=()=>{step.value=Math.min(+step.max,+step.value+1);draw()};document.getElementById('back').onclick=()=>{step.value=Math.max(0,+step.value-1);draw()};draw();</script>
